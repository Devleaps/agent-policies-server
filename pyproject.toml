[project]
name = "re-internal-agent-policies"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "bashlex>=0.18",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "regopy>=1.5.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
exclude = ["mutants"]

[tool.mypy]
exclude = ["mutants"]
